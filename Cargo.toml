[package]
name = "evm-fork-cache"
version = "0.4.2-alpha.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Forked EVM state cache, snapshots, overlays, and simulation utilities for EVM search"
keywords = ["evm", "revm", "defi", "simulation", "ethereum"]
categories = ["cryptography::cryptocurrencies", "simulation", "caching"]
readme = "README.md"
repository = "https://github.com/KaiCode2/evm-fork-cache"
documentation = "https://docs.rs/evm-fork-cache"

# Keep the published crate lean: development specs and release plans (per-phase
# build orders with internal line references) are planning artifacts, and the CI
# workflow and source-tree release audit have no consumer value. The
# consumer-facing ROADMAP.md, KNOWN_ISSUES.md, INTERNALS.md, and benchmark notes
# under docs/ are still shipped.
exclude = [
    "docs/*-spec.md",
    "docs/*-plan.md",
    ".github/",
    "tests/public_release_surface.rs",
]

# Build the docs.rs page with every feature enabled so the full surface — the
# reactive runtime, the default WebSocket subscriber, the opt-in polling
# transport, the transport-free raw JSON Flashblocks adapter, and cold-start —
# is all documented (docs.rs builds with default features otherwise). `--cfg
# docsrs` is the conventional hook for any feature-gated doc annotations.
[package.metadata.docs.rs]
features = ["alloy1", "reactive", "ingress-timing", "reactive-ws", "reactive-polling", "raw-flashblocks-json"]
rustdoc-args = ["--cfg", "docsrs"]

# Standalone workspace root: keeps this crate from being absorbed by any
# ancestor-directory workspace and gives it its own Cargo.lock.
[workspace]

[features]
default = ["alloy1", "reactive", "reactive-ws"]
alloy1 = [
    "alloy-transport-balancer/alloy1",
    "dep:alloy-consensus",
    "dep:alloy-contract",
    "dep:alloy-eips",
    "dep:alloy-network",
    "dep:alloy-provider",
    "dep:alloy-pubsub",
    "dep:alloy-rpc-client",
    "dep:alloy-rpc-types-eth",
    "dep:foundry-fork-db",
    "dep:revm",
]
alloy2 = [
    "alloy-transport-balancer/alloy2",
    "dep:alloy2-consensus",
    "dep:alloy2-contract",
    "dep:alloy2-eips",
    "dep:alloy2-network",
    "dep:alloy2-provider",
    "dep:alloy2-pubsub",
    "dep:alloy2-rpc-client",
    "dep:alloy2-rpc-types-eth",
    "dep:foundry-fork-db2",
    "dep:revm2",
]
reactive = []
# Optional process-local receipt provenance; no telemetry backend is selected.
ingress-timing = ["reactive"]
# `tokio/sync` exposes `broadcast::error::RecvError`, which the pubsub log and
# header streams match on so a dropped notification is observable instead of
# being silently skipped. alloy-pubsub already enables it, but relying on
# feature unification from a transitive dependency would break a build that
# resolved it differently.
reactive-ws = ["reactive", "alloy-provider?/ws", "alloy2-provider?/ws", "dep:rustls", "rustls/ring", "tokio/sync"]
reactive-polling = ["reactive"]
# Receipt-enriched indexed JSON conversion plus a bounded in-process handoff.
# The application owns the source socket and its complete lifecycle; this
# feature adds no network transport.
raw-flashblocks-json = ["reactive", "tokio/sync"]

[dependencies]
alloy-consensus = { version = ">=1.1.2, <1.7", optional = true }
alloy-contract = { version = ">=1.0.38, <1.7", optional = true }
alloy-eips = { version = ">=1.0.38, <1.7", optional = true }
alloy-network = { version = ">=1.0.38, <1.7", optional = true }
alloy-primitives = { version = ">=1.4, <2", features = ["map"] }
# Pulled by `reactive-ws` only. `alloy-provider/ws` already brings this in; it is
# declared explicitly because the pubsub log and header streams consume
# `Subscription::into_raw()` directly, so a dropped notification surfaces as a
# `broadcast::error::RecvError::Lagged` instead of being silently skipped by
# `Subscription::into_stream()`.
alloy-pubsub = { version = ">=1.0.38, <1.7", optional = true }
alloy-provider = { version = ">=1.0.38, <1.7", optional = true }
alloy-rlp = "0.3"
alloy-rpc-client = { version = ">=1.0.38, <1.7", optional = true }
alloy-rpc-types-eth = { version = ">=1.0.38, <1.7", optional = true }
alloy-sol-types = ">=1.4, <2"
alloy-transport-balancer = { version = "0.3.0", default-features = false }

alloy2-consensus = { package = "alloy-consensus", version = "2", optional = true }
alloy2-contract = { package = "alloy-contract", version = "2", optional = true }
alloy2-eips = { package = "alloy-eips", version = "2", optional = true }
alloy2-network = { package = "alloy-network", version = "2", optional = true }
alloy2-pubsub = { package = "alloy-pubsub", version = "2", optional = true }
alloy2-provider = { package = "alloy-provider", version = "2", optional = true }
alloy2-rpc-client = { package = "alloy-rpc-client", version = "2", optional = true }
alloy2-rpc-types-eth = { package = "alloy-rpc-types-eth", version = "2", optional = true }

futures = "0.3"
bincode = "1.3"
foundry-fork-db = { version = "0.22", optional = true }
foundry-fork-db2 = { package = "foundry-fork-db", version = "0.26", optional = true }
revm = { version = "34.0", features = ["std", "serde", "optional_eip3607", "optional_no_base_fee", "optional_balance_check"], optional = true }
revm2 = { package = "revm", version = "38.0", features = ["std", "serde", "optional_eip3607", "optional_no_base_fee", "optional_balance_check"], optional = true }
# Pulled by `reactive-ws` only to select rustls' `ring` crypto provider for the
# alloy WebSocket (wss://) TLS path. If a transitive dep also enabled aws-lc-rs,
# rustls 0.23 would have no unambiguous process default and a wss:// connection
# would panic ("no process-level CryptoProvider available"); the AlloySubscriber
# installs the ring provider best-effort at WS init. Do not remove without
# re-checking the TLS provider story.
rustls = { version = "0.23", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["derive", "rc"] }
thiserror = "2.0"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time"] }
tracing = "0.1.41"

[dev-dependencies]
anyhow = "1.0.98"
alloy-json-rpc = ">=1.0.38, <1.7"
alloy-node-bindings = ">=1.1.2, <1.7"
alloy-rpc-client = { version = ">=1.0.38, <1.7", features = ["reqwest"] }
alloy-transport = ">=1.0.38, <1.7"
alloy-transport-http = ">=1.0.38, <1.7"
alloy2-json-rpc = { package = "alloy-json-rpc", version = "2" }
alloy2-node-bindings = { package = "alloy-node-bindings", version = "2" }
alloy2-rpc-client = { package = "alloy-rpc-client", version = "2", features = ["reqwest"] }
alloy2-transport = { package = "alloy-transport", version = "2" }
alloy2-transport-http = { package = "alloy-transport-http", version = "2" }
criterion = "0.5"
proptest = "1"
# Gzip-capable HTTP client for the bulk-storage benchmark example: enabling the
# `gzip` feature makes reqwest advertise `Accept-Encoding: gzip` and
# transparently decompress responses — a large win for multi-hundred-KB
# `eth_call` payloads (see docs/bulk-storage-extraction.md).
reqwest = { version = "0.12", default-features = false, features = ["gzip"] }
reqwest2 = { package = "reqwest", version = "0.13", default-features = false, features = ["gzip"] }
# `macros` powers `#[tokio::main]`/`#[tokio::test]` in the examples and tests.
# `time` lets live RPC examples bound their subscription windows.
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower = "0.5"

[[bench]]
name = "revert_decoding"
harness = false

[[bench]]
name = "create3"
harness = false

[[bench]]
name = "access_list"
harness = false

[[bench]]
name = "simulation"
harness = false

[[bench]]
name = "fanout"
harness = false

[[bench]]
name = "freshness"
harness = false

[[bench]]
name = "state_update"
harness = false

[[bench]]
name = "raw_json_flashblocks"
harness = false
required-features = ["raw-flashblocks-json"]

[[bench]]
name = "event_pipeline"
harness = false

[[bench]]
name = "reactive_routing"
harness = false
required-features = ["reactive"]

[[bench]]
name = "mapping_probe"
harness = false

[[example]]
name = "reactive_alloy_amm_live_probe"
required-features = ["reactive"]

[[example]]
name = "reactive_runtime"
required-features = ["reactive"]

[[example]]
name = "reactive_engine_lifecycle"
required-features = ["reactive"]

[[example]]
name = "cold_start"
required-features = ["reactive"]

[[example]]
name = "raw_json_flashblocks_subscriber_acceptance"
required-features = ["raw-flashblocks-json", "reactive-ws"]

# RPC-gated real-contract benchmarks. Skipped (not failed) when RPC_URL is unset,
# so `cargo bench` stays offline by default.
[[bench]]
name = "rpc_mainnet"
harness = false
